services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sam1
      POSTGRES_PASSWORD: sam1
      POSTGRES_DB: sam1
    ports:
      - "5432:5432"
    volumes:
      - sam1-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sam1 -d sam1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sam1-db:
